name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RequestMovies.slnx -c Release
      - run: dotnet test RequestMovies.slnx -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: Jellyfin.Plugin.RequestMovies/bin/Release/net10.0/Jellyfin.Plugin.RequestMovies.dll
