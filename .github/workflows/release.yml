name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Jellyfin.Plugin.RequestMovies/Jellyfin.Plugin.RequestMovies.csproj -c Release
      - name: Paquet et manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -j "dist/request-movies_${VERSION}.zip" Jellyfin.Plugin.RequestMovies/bin/Release/net10.0/Jellyfin.Plugin.RequestMovies.dll
          python3 scripts/update-manifest.py "$VERSION" "dist/request-movies_${VERSION}.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/request-movies_${VERSION}.zip"
          cp manifest.json dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/manifest.json
      - name: Commit du manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest ${GITHUB_REF_NAME}" || true
          git push origin HEAD:main
